<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition</title>
    <link rel="stylesheet" href="{{ url_for('static', path='face.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container animate-fade-left">
        <div class="nav-header">
            <button class="btn-icon" onclick="window.location.href='/'">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </button>
            <h1 class="page-title">Real-time Face Recognition</h1>
        </div>

        <div class="layout-grid">
            <div class="main-column">
                <div class="camera-container shadow-inner" id="cameraContainer">

                    <img id="videoFrame"
                        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 10; display: none;">

                    <div id="cameraOfflineBg" class="camera-offline-bg">
                        <div class="offline-icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
                                <circle cx="12" cy="13" r="3" />
                            </svg>
                        </div>
                        <p class="offline-text">CAMERA_OFFLINE</p>
                    </div>
                </div>

                <div class="controls-bar panel-glass">
                    <div class="controls-group">
                        <button id="toggleCameraBtn" class="btn btn-cyan" onclick="toggleCamera()">
                            <svg id="toggleIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                            <span id="toggleText">Start Camera</span>
                        </button>
                        <button class="btn btn-outline" onclick="reloadDatabase()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                                <path d="M3 3v5h5" />
                            </svg>
                            Reload DB
                        </button>
                    </div>

                    <div id="statusBadge" class="status-badge">
                        <svg id="statusIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" style="color: var(--rose-primary);">
                            <line x1="2" y1="2" x2="22" y2="22" />
                            <path d="M8.5 16.5a5 5 0 0 1 7 0" />
                            <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
                            <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.82" />
                        </svg>
                        <span id="statusText">DISCONNECTED</span>
                    </div>
                </div>
            </div>

            <div class="side-column">
                <div class="panel panel-glass h-full">
                    <div class="panel-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon-cyan">
                            <path
                                d="M2 12a5 5 0 0 0 5 5 8 8 0 0 1 5 2 8 8 0 0 1 5-2 5 5 0 0 0 5-5V7h-5a8 8 0 0 0-5 2 8 8 0 0 0-5-2H2Z" />
                            <path d="M6 11c.333-.667 1-1 2-1s1.667.333 2 1" />
                            <path d="M14 11c.333-.667 1-1 2-1s1.667.333 2 1" />
                        </svg>
                        <h3>Detection Results</h3>
                    </div>

                    <div class="info-row">
                        <span class="label">Faces in frame:</span>
                        <span id="facesCount" class="value-highlight">0</span>
                    </div>

                    <div id="resultsList" class="results-list">
                        <div
                            style="height: 100%; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.875rem; font-family: monospace; font-style: italic;">
                            No faces detected
                        </div>
                    </div>

                    <img id="db-picture" src=""
                        style="display: none; width: 100%; margin-top: 16px; border-radius: 8px; border: 1px solid rgba(34, 211, 238, 0.3); object-fit: cover;">
                </div>

                <div class="panel panel-glass">
                    <div class="panel-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon-cyan">
                            <ellipse cx="12" cy="5" rx="9" ry="3" />
                            <path d="M3 5V19A9 3 0 0 0 21 19V5" />
                            <path d="M3 12A9 3 0 0 0 21 12" />
                        </svg>
                        <h3>Database Info</h3>
                    </div>

                    <div class="info-row mb-4">
                        <span class="label">Registered profiles:</span>
                        <span id="dbCount" class="value-highlight">0</span>
                    </div>

                    <div>
                        <span class="section-subtitle">Registered Names</span>
                        <div id="dbNames" class="tags-container">
                            <span class="tag">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let isConnected = false;

        // SVG Icons สำหรับ UI
        const playIconSVG = `<polygon points="5 3 19 12 5 21 5 3"/>`;
        const squareIconSVG = `<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>`;
        const wifiOnSVG = `<path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/>`;
        const wifiOffSVG = `<line x1="2" y1="2" x2="22" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.82"/>`;

        function updateUIStatus(connected) {
            isConnected = connected;
            const toggleBtn = document.getElementById('toggleCameraBtn');
            const toggleIcon = document.getElementById('toggleIcon');
            const toggleText = document.getElementById('toggleText');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const videoFrame = document.getElementById('videoFrame');
            const cameraOfflineBg = document.getElementById('cameraOfflineBg');

            if (connected) {
                // UI Status: กล้องเปิดอยู่
                toggleBtn.className = 'btn btn-danger';
                toggleText.innerText = 'Stop Camera';
                toggleIcon.innerHTML = squareIconSVG;

                statusText.innerText = 'CONNECTED';
                statusIcon.innerHTML = wifiOnSVG;
                statusIcon.style.color = '';
                statusIcon.className = 'icon-emerald';

                videoFrame.style.display = 'block';
                cameraOfflineBg.style.display = 'none';
            } else {
                // UI Status: กล้องปิดอยู่
                toggleBtn.className = 'btn btn-cyan';
                toggleText.innerText = 'Start Camera';
                toggleIcon.innerHTML = playIconSVG;

                statusText.innerText = 'DISCONNECTED';
                statusIcon.innerHTML = wifiOffSVG;
                statusIcon.className = '';
                statusIcon.style.color = 'var(--rose-primary)';

                videoFrame.style.display = 'none';
                cameraOfflineBg.style.display = 'flex';

                // Clear UI Data
                updateRecognitionResults([]);
                document.getElementById("db-picture").style.display = "none";
                document.getElementById('videoFrame').src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
            }
        }

        function toggleCamera() {
            if (isConnected) {
                stopCamera();
            } else {
                startCamera();
            }
        }

        function startCamera() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log('Camera already running');
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/face`;

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = function () {
                    console.log('WebSocket connected');
                    updateUIStatus(true);
                };

                ws.onmessage = function (event) {
                    const data = JSON.parse(event.data);

                    // 1. Update video frame
                    if (data.frame) {
                        const videoFrame = document.getElementById('videoFrame');
                        videoFrame.src = `data:image/jpeg;base64,${data.frame}`;
                    }

                    // 2. Update recognition results
                    if (data.faces) {
                        updateRecognitionResults(data.faces);

                        // 3. Update Picture from DB
                        const dbPicture = document.getElementById("db-picture");
                        if (data.faces.length > 0 && data.faces[0].image_url) {
                            dbPicture.src = data.faces[0].image_url;
                            dbPicture.style.display = "block";
                        } else {
                            dbPicture.src = "";
                            dbPicture.style.display = "none";
                        }
                    }
                };

                ws.onclose = function () {
                    console.log('WebSocket disconnected');
                    updateUIStatus(false);
                };

                ws.onerror = function (error) {
                    console.error('WebSocket error:', error);
                    updateUIStatus(false);
                };
            } catch (err) {
                console.error("Failed to connect to WebSocket", err);
                alert("Cannot connect to camera server.");
            }
        }

        function stopCamera() {
            if (ws) {
                ws.close();
                ws = null;
            }
            updateUIStatus(false);
        }

        function updateRecognitionResults(faces) {
            const facesCount = document.getElementById('facesCount');
            const resultsList = document.getElementById('resultsList');

            facesCount.textContent = faces.length;
            resultsList.innerHTML = '';

            if (faces.length === 0) {
                resultsList.innerHTML = `
                    <div style="height: 100%; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.875rem; font-family: monospace; font-style: italic;">
                        No faces detected
                    </div>
                `;
                return;
            }

            // สร้าง UI แสดงรายชื่อคนที่ตรวจจับได้
            faces.forEach(face => {
                const isKnown = face.name !== 'Unknown';
                const confidenceStr = (face.confidence * 100).toFixed(1) + '%';

                const itemDiv = document.createElement('div');
                itemDiv.className = 'result-item animate-scale-in';
                if (!isKnown) {
                    itemDiv.style.backgroundColor = 'rgba(244, 63, 94, 0.05)';
                    itemDiv.style.borderColor = 'rgba(244, 63, 94, 0.2)';
                }

                itemDiv.innerHTML = `
                    <span class="result-name" style="${!isKnown ? 'color: #f43f5e;' : ''}">${face.name}</span>
                    <span class="result-confidence" style="${!isKnown ? 'color: #f43f5e; background-color: rgba(244, 63, 94, 0.1);' : ''}">
                        ${isKnown ? confidenceStr : 'N/A'}
                    </span>
                `;
                resultsList.appendChild(itemDiv);
            });
        }

        async function reloadDatabase() {
            try {
                const response = await fetch('/reload_database', { method: 'POST' });
                const result = await response.json();
                alert(result.message || result.status);
                loadDatabaseInfo(); // โหลดข้อมูล DB ใหม่ทันทีหลังจาก Reload
            } catch (error) {
                console.error('Error reloading database:', error);
                alert('Error reloading database');
            }
        }

        async function loadDatabaseInfo() {
            try {
                const response = await fetch('/face_count');
                const data = await response.json();

                document.getElementById('dbCount').textContent = data.count;

                const dbNamesContainer = document.getElementById('dbNames');
                dbNamesContainer.innerHTML = '';

                if (data.names && data.names.length > 0) {
                    data.names.forEach(name => {
                        const span = document.createElement('span');
                        span.className = 'tag';
                        span.textContent = name;
                        dbNamesContainer.appendChild(span);
                    });
                } else {
                    dbNamesContainer.innerHTML = '<span class="tag" style="color:#64748b; border-color:transparent; background:transparent;">No profiles found</span>';
                }
            } catch (error) {
                console.error('Error loading database info:', error);
                document.getElementById('dbNames').innerHTML = '<span class="tag" style="color:#f43f5e; border-color:rgba(244,63,94,0.3);">Error loading data</span>';
            }
        }

        // โหลดข้อมูล DB เมื่อเปิดหน้าเว็บ
        window.onload = function () {
            loadDatabaseInfo();
        };

        // ปิดกล้องอัตโนมัติเมื่อผู้ใช้ออกจากหน้าเว็บ
        window.onbeforeunload = function () {
            stopCamera();
        };
    </script>
</body>

</html>
